  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    /* Minimal markdown renderer for admin-written posts. HTML in the
       source is escaped first, then a safe subset of markdown is applied:
       ##/### headings, **bold**, *italic*, [text](http links),
       - and 1. lists, > blockquotes, paragraphs. */
    function renderMarkdown(md) {
      var esc = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var lines = esc.split(/\r?\n/);
      var html = [];
      var list = null; // 'ul' | 'ol' | null

      function closeList() { if (list) { html.push('</' + list + '>'); list = null; } }
      function inline(s) {
        return s
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var t = line.trim();
        if (!t) { closeList(); continue; }
        var m;
        if ((m = t.match(/^###\s+(.*)/))) { closeList(); html.push('<h3>' + inline(m[1]) + '</h3>'); }
        else if ((m = t.match(/^##\s+(.*)/))) { closeList(); html.push('<h2>' + inline(m[1]) + '</h2>'); }
        else if ((m = t.match(/^#\s+(.*)/))) { closeList(); html.push('<h2>' + inline(m[1]) + '</h2>'); }
        else if ((m = t.match(/^&gt;\s?(.*)/))) { closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
        else if ((m = t.match(/^[-*]\s+(.*)/))) {
          if (list !== 'ul') { closeList(); html.push('<ul>'); list = 'ul'; }
          html.push('<li>' + inline(m[1]) + '</li>');
        }
        else if ((m = t.match(/^\d+\.\s+(.*)/))) {
          if (list !== 'ol') { closeList(); html.push('<ol>'); list = 'ol'; }
          html.push('<li>' + inline(m[1]) + '</li>');
        }
        else { closeList(); html.push('<p>' + inline(t) + '</p>'); }
      }
      closeList();
      return html.join('\n');
    }

    (function () {
      var slug = new URLSearchParams(location.search).get('slug');
      var titleEl = document.getElementById('post-title');
      var dateEl = document.getElementById('post-date');
      var bodyEl = document.getElementById('post-body');
      if (!slug) {
        titleEl.textContent = 'Post not found';
        bodyEl.innerHTML = '<p>No post was specified. Head back to <a href="blog.html">the field notes</a>.</p>';
        return;
      }
      litpathFetch('/api/posts/' + encodeURIComponent(slug), 20000)
        .then(function (post) {
          document.title = post.title + ' — The Lit Path';
          titleEl.textContent = post.title;
          if (post.published_at) dateEl.textContent = 'Field note · ' + litpathMonthYear(post.published_at);
          bodyEl.innerHTML = renderMarkdown(post.body_md) +
            '<div class="article-cta"><p>Standing at a turning point of your own?</p>' +
            '<a class="btn btn-primary" href="index.html#contact">Book a free discovery call</a></div>';
        })
        .catch(function () {
          titleEl.textContent = 'This note is taking a moment';
          bodyEl.innerHTML = '<p>The post could not be loaded right now — the server may just be waking up. ' +
            '<a href="javascript:location.reload()">Try again</a> or head back to <a href="blog.html">the field notes</a>.</p>';
        });
    })();
  </script>
