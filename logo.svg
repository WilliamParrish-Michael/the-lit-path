<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="The Lit Path logo">
  <!-- The Lit Path logo — a dotted footstep trail winding up into a flame.
       Wordmark renders in Fraunces when available (imported below for
       browser viewing); falls back to Georgia elsewhere. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&amp;display=swap');
    .word { font: 600 44px 'Fraunces', Georgia, serif; fill: #F6EFE3; }
    .word .lit { font-style: italic; fill: #FFB44D; }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E2703A"/><stop offset="1" stop-color="#FFB44D"/>
    </linearGradient>
  </defs>
  <rect width="420" height="120" rx="16" fill="#141A38"/>
  <g transform="translate(28 14) scale(2.9)">
    <path d="M7 29.5 C 17 27.5, 23.5 24.5, 16.5 21.5 C 10 18.7, 12 16.8, 16 15.6" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 4.6"/>
    <path d="M16 1.5c1.9 3.2 5.4 5.2 5.4 9.4a5.4 5.4 0 1 1-10.8 0c0-2.3 1.1-3.9 2.4-5.5.4 1.2 1 2 1.9 2.7-.5-2.2-.3-4.1 1.1-6.6z" fill="url(#lg)"/>
  </g>
  <text class="word" x="140" y="74">The <tspan class="lit">Lit</tspan> Path</text>
</svg>
